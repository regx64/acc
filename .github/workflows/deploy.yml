# main → ARM images on GHCR → Cloudflare Pages → the VM.
#
# Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, DEPLOY_HOST,
# DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS.
# Variables: PAGES_PROJECT (Cloudflare Pages project name).
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  images:
    # Native ARM runner: no QEMU, so Rust builds stay fast.
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        include:
          - name: acc
            context: .
            file: deploy/Dockerfile
          - name: acc-go-judge
            context: deploy/go-judge
            file: deploy/go-judge/Dockerfile
          - name: acc-backup
            context: deploy/backup
            file: deploy/backup/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  pages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build
        working-directory: web
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: pages deploy .svelte-kit/cloudflare --project-name=${{ vars.PAGES_PROJECT }} --branch=main

  vm:
    runs-on: ubuntu-24.04
    needs: [images]
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
      - name: Ship compose file and roll out
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: |
          scp deploy/compose.yml "$TARGET:/opt/acc/compose.yml"
          ssh "$TARGET" "cd /opt/acc && sed -i 's/^ACC_TAG=.*/ACC_TAG=${{ github.sha }}/' .env && docker compose pull && docker compose up -d --remove-orphans && docker image prune -f"
      - name: Wait for health
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: |
          for i in $(seq 30); do
            ssh "$TARGET" "docker compose -f /opt/acc/compose.yml ps api --format '{{.Health}}'" | grep -q healthy && exit 0
            sleep 5
          done
          echo "api did not become healthy" >&2; exit 1
