# Every PR: Rust build/test/clippy, frontend build/typecheck, and an
# end-to-end run of the whole stack with the real sandbox.
name: CI
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  # The committed API types must match what the API actually serves.
  api-types:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run gen:api
        working-directory: web
      - run: git diff --exit-code web/src/lib/api

  e2e:
    runs-on: ubuntu-24.04
    needs: [rust]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Start Postgres, Redis, go-judge, MinIO
        run: |
          mkdir -p var/cache
          docker compose -f compose.dev.yml up -d --build --wait postgres redis go-judge minio
          docker compose -f compose.dev.yml run --rm minio-init
      - run: cargo build --locked -p acc-api -p acc-worker -p acc-judge
      - name: Judge verdicts and sandbox attacks (M1)
        run: cargo test -p acc-judge --locked -- --test-threads=2
        env:
          GO_JUDGE_URL: http://127.0.0.1:5050
          GO_JUDGE_PATH: /usr/local/rust-bin:/usr/local/bin:/usr/bin:/bin
      - name: API + worker smoke test
        run: |
          set -a; . ./.env.example; set +a
          ./target/debug/acc-api > api.log 2>&1 &
          ./target/debug/acc-worker > worker.log 2>&1 &
          for i in $(seq 30); do curl -fs http://127.0.0.1:8080/api/v1/health && break; sleep 1; done
          API=http://127.0.0.1:8080/api/v1 API_LOG=api.log scripts/smoke.sh
      - if: failure()
        run: tail -n 100 api.log worker.log; docker compose -f compose.dev.yml logs --tail 100
