[package]
name = "acc-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = { version = "1.0.104", optional = true }
object_store = { version = "0.14.2", features = ["aws"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "postgres", "chrono"], optional = true }
thiserror = "2.0.21"

[dependencies.chrono]
version = "0.4"
optional = true

[features]
db = ["dep:sqlx", "dep:anyhow", "dep:chrono"]
storage = ["dep:object_store", "dep:anyhow"]
