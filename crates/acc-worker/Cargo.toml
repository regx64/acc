[package]
name = "acc-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
acc-core = { version = "0.1.0", path = "../acc-core", features = ["db", "storage"] }
acc-judge = { version = "0.1.0", path = "../acc-judge" }
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
object_store = { version = "0.14.2", features = ["aws"] }
redis = { version = "1.2.2", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "chrono", "json", "migrate"] }
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
